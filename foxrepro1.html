    <!-- LOGICA DE CARGA DINAMICA DE IFRAME, FULLSCREEN Y OPTIMIZACION SEO -->
    <script>
        function getParameterByName(name) {
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
                results = regex.exec(location.search);
            return results === null ? "" : decodeURIComponent(results[1]);
        }

        var streamUrl = getParameterByName("stream");
        var spinner = document.getElementById("loadingSpinner");
        var playerBox = document.getElementById("playerBox");

        if (streamUrl) {
            var currentFullUrl = window.location.href;
            document.getElementById("canonicalUrl").setAttribute("href", currentFullUrl);
            document.getElementById("ogUrl").setAttribute("content", currentFullUrl);

            var iframe = document.createElement("iframe");
            iframe.id = "embedIframe";
            iframe.src = streamUrl;
            iframe.setAttribute("sandbox", "allow-same-origin allow-scripts allow-presentation allow-forms");
            iframe.setAttribute("allowfullscreen", "true");
            iframe.setAttribute("scrolling", "no");
            iframe.setAttribute("allow", "autoplay; fullscreen; encrypted-media");
            
            iframe.onload = function() {
                hideSpinner();
            };

            playerBox.appendChild(iframe);
        } else {
            if (spinner) spinner.style.display = "none";
            var emptyMessage = document.createElement("div");
            emptyMessage.className = "absolute inset-0 flex items-center justify-center text-xs text-slate-500 font-bold uppercase tracking-wider";
            emptyMessage.innerText = "Selecciona un partido de la agenda...";
            playerBox.appendChild(emptyMessage);
        }

        function hideSpinner() {
            if (spinner) {
                spinner.style.opacity = "0";
                setTimeout(function() {
                    spinner.style.display = "none";
                }, 300);
            }
        }

        function toggleFullscreen() {
            var elem = document.getElementById("playerBox");
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
